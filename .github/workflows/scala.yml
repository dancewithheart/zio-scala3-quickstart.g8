name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Get changes from Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 8
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'oracle-openjdk'
        java-version: 25
    - name: Set up Scala and SBT
      uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1     
    - name: Run tests
      run: sbt clean test
