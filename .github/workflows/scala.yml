name: Scala CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Get changes from Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 8
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'oracle-openjdk'
        java-version: 25
    - name: Set up Scala and SBT
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1     
    - name: Run tests
      run: sbt "clean ; test ; g8Test"
