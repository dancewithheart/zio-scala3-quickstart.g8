name: Scala CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Get changes from Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 8
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: 'oracle-openjdk'
        java-version: 25
    - name: Set up Scala and SBT
      uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1     
    - name: Run tests
      run: sbt "clean ; test ; g8Test"
