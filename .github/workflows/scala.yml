name: Scala CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Get changes from Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 8
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'oracle-openjdk'
        java-version: 25
    - name: Set up Scala and SBT
      uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1     
    - name: Run tests
      run: sbt "clean ; test ; g8Test"
